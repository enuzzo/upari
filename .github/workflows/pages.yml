name: Dati del giorno e pubblicazione

# Every day: fetch today's planet (winds, sea, ice, plankton, rain, fires, earthquakes, ISS orbit),
# rebuild the site and publish it on upari.earth (SiteGround, over FTPS). Also runs on every push to main.
# GitHub Pages only keeps a page that sends the old address, enuzzo.github.io/upari, to upari.earth.
# 10:41 UTC comes after NASA publishes yesterday's GHRSST MUR and GAMSSA days.
# Fresh data are not committed: the repository keeps a validated snapshot that is
# used whenever a source is late, partial or unreachable.
# The daily run fetches everything and keeps what it fetched in the Actions cache. A push
# reuses that (if it is less than 36 hours old) and fetches again only the datasets whose
# script changed; a change to this workflow, a missing or old cache, or a manual run with
# "full" fetches everything.
'on':
  schedule:
    - cron: '41 10 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Fetch every dataset again (ignore the cache)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'enuzzo/upari'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Leggi il codice
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: ImageMagick e lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends imagemagick lftp
          convert -version | head -1

      - name: Dipendenze
        run: npm ci --no-audit --no-fund

      - name: Ultimi dati scaricati
        # The newest data kept by a full run (keys sort by run id).
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/daily
          key: daily-data-none
          restore-keys: daily-data-

      - name: Cosa scaricare
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          DAILY: ${{ runner.temp }}/daily
        run: |
          full=0; why=''
          if [ "$EVENT" = schedule ]; then full=1; why='giro quotidiano'
          elif [ "$FULL_INPUT" = true ]; then full=1; why='richiesto a mano'
          elif [ ! -f "$DAILY/data.tgz" ] || [ ! -f "$DAILY/meta" ]; then full=1; why='nessun dato in cache'
          else
            . "$DAILY/meta"   # DATA_SHA, DATA_TIME (epoch seconds)
            age=$(( $(date +%s) - DATA_TIME ))
            if [ $age -gt $((36 * 3600)) ]; then full=1; why="dati in cache di $((age / 3600)) ore"
            elif ! git fetch --no-tags --depth=1 origin "$DATA_SHA" 2>/dev/null; then full=1; why='commit dei dati non trovato'
            else
              git diff --name-only "$DATA_SHA" HEAD > "$RUNNER_TEMP/changed"
              if grep -q '^\.github/workflows/' "$RUNNER_TEMP/changed"; then full=1; why='workflow cambiato'; fi
            fi
          fi
          if [ $full = 1 ]; then
            for k in wind layers sky climate lightning; do echo "$k=1" >> "$GITHUB_OUTPUT"; done
            echo "full=1" >> "$GITHUB_OUTPUT"
            echo "> Dati: tutto scaricato di nuovo ($why)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The cached files, except those this push changed itself (committed data win).
          grep '^public/' "$RUNNER_TEMP/changed" > "$RUNNER_TEMP/exclude" || true
          tar -xzf "$DAILY/data.tgz" --exclude-from="$RUNNER_TEMP/exclude"
          echo "full=0" >> "$GITHUB_OUTPUT"
          again=''
          for pair in wind:scripts/prepare-fields.mjs layers:scripts/prepare-layers.mjs sky:scripts/prepare-sky.mjs climate:scripts/prepare-climate.mjs lightning:scripts/prepare-lightning.py; do
            k=${pair%%:*}; f=${pair#*:}
            if grep -qx "$f" "$RUNNER_TEMP/changed"; then echo "$k=1" >> "$GITHUB_OUTPUT"; again="$again $k"; else echo "$k=0" >> "$GITHUB_OUTPUT"; fi
          done
          echo "> Dati: ripresi dal giro del $(date -u -d @"$DATA_TIME" '+%d/%m %H:%M') UTC (commit ${DATA_SHA:0:7}); scaricati di nuovo:${again:- nessuno}." >> "$GITHUB_STEP_SUMMARY"

      - name: Dati del giorno
        id: refresh
        # A source that fails keeps its published snapshot; the site is rebuilt anyway.
        continue-on-error: true
        timeout-minutes: 32
        env:
          MAGICK_BIN: convert
          UPARI_TMP: ${{ runner.temp }}/upari
          UPARI_DEADLINE_MIN: '28'
        run: |
          status=0
          if [ "${{ steps.plan.outputs.wind }}" = 1 ]; then node scripts/prepare-fields.mjs wind || status=1; fi
          # Series keep their past months in the repository: only new months and the latest day are fetched.
          if [ "${{ steps.plan.outputs.layers }}" = 1 ]; then
            node scripts/prepare-layers.mjs sst anomaly ice chlorophyll ndvi aerosol coral ozone no2 snow ims mhw sealevel so2 rain waves fires quakes cyclones volcanoes icebergs slicks || status=1
          fi
          exit $status

      - name: Il cielo e il clima
        # Satellites, the Sun, aurora, launches, asteroids, fireballs, Voyager; temperature, CO2, sea ice.
        # Each source keeps its published file when it fails.
        continue-on-error: true
        timeout-minutes: 6
        env:
          MAGICK_BIN: convert
          UPARI_TMP: ${{ runner.temp }}/upari
        run: |
          status=0
          if [ "${{ steps.plan.outputs.sky }}" = 1 ]; then
            # ffmpeg tiles the Sun's last day; the runner may not have it.
            command -v ffmpeg >/dev/null || sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null || true
            node scripts/prepare-sky.mjs || status=1
          fi
          if [ "${{ steps.plan.outputs.climate }}" = 1 ]; then node scripts/prepare-climate.mjs || status=1; fi
          exit $status

      - name: I fulmini
        # The last half hour of the two GOES Lightning Mappers (NOAA open data on AWS).
        # Keeps the published file when it fails.
        if: steps.plan.outputs.lightning == '1'
        continue-on-error: true
        timeout-minutes: 4
        env:
          UPARI_TMP: ${{ runner.temp }}/upari
        run: |
          mkdir -p "$UPARI_TMP"
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet h5py numpy
          "$RUNNER_TEMP/py/bin/python" scripts/prepare-lightning.py public/layers

      - name: Orbita della ISS
        # One request a day to CelesTrak instead of one per visitor.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          curl -fsS --max-time 60 'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=JSON' -o "$RUNNER_TEMP/iss.json"
          node -e 'const [o]=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!o||o.NORAD_CAT_ID!==25544||!o.EPOCH) process.exit(1)' "$RUNNER_TEMP/iss.json"
          cp "$RUNNER_TEMP/iss.json" public/sky/iss.json

      - name: Conserva i dati scaricati
        # What a full run fetched (the files under public/ that differ from the repository),
        # for the pushes of the next hours.
        if: steps.plan.outputs.full == '1'
        env:
          DAILY: ${{ runner.temp }}/daily
        run: |
          mkdir -p "$DAILY"
          # Ignored files too (the satellites are fetched in CI only); never a file that is gone.
          git ls-files -m -o -- public | while read -r f; do [ -f "$f" ] && echo "$f"; done | sort -u > "$RUNNER_TEMP/fetched"
          tar -czf "$DAILY/data.tgz" -T "$RUNNER_TEMP/fetched"
          printf 'DATA_SHA=%s\nDATA_TIME=%s\n' "$GITHUB_SHA" "$(date +%s)" > "$DAILY/meta"
          echo "> Dati conservati: $(wc -l < "$RUNNER_TEMP/fetched") file, $(du -h "$DAILY/data.tgz" | cut -f1)." >> "$GITHUB_STEP_SUMMARY"

      - name: Salva i dati in cache
        if: steps.plan.outputs.full == '1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/daily
          key: daily-data-${{ github.run_id }}

      - name: Riepilogo dei dati
        if: always()
        run: |
          {
            echo '## Dati pubblicati'
            echo
            echo '| Strato | Date | Copertura |'
            echo '|---|---|---|'
            for f in sst anomaly ice chlorophyll ndvi aerosol coral ozone no2 snow ims mhw sealevel waves; do
              node -e 'const m=require("./public/layers/"+process.argv[1]+".json"); console.log(`| ${m.id} | ${m.frames ? `${m.frames[0].time} → ${m.frames.at(-1).time}` : (m.dates||[])[0]} | ${m.frames ? `${m.frames.length} fotogrammi` : m.coverage} |`)' "$f"
            done
            node -e 'const m=require("./public/layers/rain.json"); console.log(`| pioggia | ${m.frames[0].time} → ${m.frames.at(-1).time} | ${m.frames.length} fotogrammi |`)'
            node -e 'const m=require("./public/layers/fires.json"); console.log(`| fuochi | fino al ${m.newest} | ${m.detections} rilevamenti |`)'
            node -e 'const m=require("./public/fields/wind.json"); console.log(`| vento | ${m.time} | ${m.valid} celle |`)'
            node -e 'const [o]=require("./public/sky/iss.json"); console.log(`| ISS | epoca ${o.EPOCH} | |`)'
            for f in cyclones volcanoes icebergs slicks; do
              node -e 'const m=require("./public/layers/"+process.argv[1]+".json"); console.log(`| ${m.id} | ${m.fetched} | ${m.count} |`)' "$f" || true
            done
            node -e 'try { const m=require("./public/sky/satellites.json"); console.log(`| satelliti | ${m.base} | ${m.count} |`) } catch { console.log("| satelliti | — | non disponibili |") }'
            node -e 'const m=require("./public/climate/temperature.json"); console.log(`| temperatura globale | ${m.last.date} | ${m.last.anomaly} °C su 1991–2020 (${m.last.status}) |`)'
            node -e 'const m=require("./public/climate/co2.json"); console.log(`| CO₂ Mauna Loa | ${m.last.date} | ${m.last.ppm} ppm |`)'
            echo
            if [ "${{ steps.refresh.outcome }}" != "success" ]; then
              echo '> Almeno una fonte non era disponibile o incompleta: per quella resta la versione precedente.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: Pubblica su upari.earth
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: scripts/deploy-siteground.sh dist

      - name: Controlla upari.earth
        # The SiteGround CDN sits in front of the server: say so if it still serves an old page or old data.
        continue-on-error: true
        # The CDN takes a minute or two to let go of the old files: ask again before saying so.
        run: |
          stale=0
          for f in index.html layers/rain.json fields/wind.json; do
            built=$(sha256sum "dist/$f" | cut -c1-64)
            fresh=0
            for try in 1 2 3 4 5 6 7 8; do
              sleep 20
              # As the page asks for them: the data files with the build's mark (src/engine/fresh.ts).
              q=''; [ "$f" != index.html ] && q="?b=$(cat dist/.build 2>/dev/null)"
              live=$(curl -fsS --max-time 30 "https://upari.earth/${f/index.html/}$q" | sha256sum | cut -c1-64)
              if [ "$live" = "$built" ]; then fresh=1; break; fi
            done
            if [ $fresh = 1 ]; then echo "$f: aggiornato"; else echo "$f: upari.earth serve ancora una versione precedente"; stale=1; fi
          done
          if [ $stale = 1 ]; then echo '> upari.earth non serve ancora tutti i file nuovi: probabilmente la cache del CDN SiteGround.' >> "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - name: Rimando dal vecchio indirizzo
        run: |
          mkdir -p redirect
          cat > redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>Upari · upari.earth</title>
          <link rel="canonical" href="https://upari.earth/">
          <script>location.replace('https://upari.earth/' + location.hash)</script>
          <meta http-equiv="refresh" content="0; url=https://upari.earth/">
          <p>Upari now lives at <a href="https://upari.earth/">upari.earth</a>.</p>
          </html>
          HTML
          cp redirect/index.html redirect/404.html

      - name: Prepara Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Carica il rimando
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect

  # Scheduled workflows stop after 60 days without repository activity:
  # once a month, commit the fresh ISS elements to keep the daily refresh alive.
  keepalive:
    if: github.event_name == 'schedule' && github.repository == 'enuzzo/upari'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Primo del mese?
        id: day
        run: echo "first=$([ "$(date -u +%d)" = 01 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Leggi il codice
        if: steps.day.outputs.first == 'yes'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Aggiorna e committa l'orbita della ISS
        if: steps.day.outputs.first == 'yes'
        run: |
          curl -fsS --max-time 60 'https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=JSON' -o "$RUNNER_TEMP/iss.json"
          node -e 'const [o]=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!o||o.NORAD_CAT_ID!==25544||!o.EPOCH) process.exit(1)' "$RUNNER_TEMP/iss.json"
          cp "$RUNNER_TEMP/iss.json" public/sky/iss.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/sky/iss.json
          git diff --cached --quiet || git commit -m 'Aggiorna gli elementi orbitali della ISS'
          git push

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

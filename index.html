<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#030407" />
  <meta name="description" content="Upari: planet Earth told by today’s satellite data. Winds, currents, seas, rain, fires, ice, lights and the Space Station." />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
  <title>Upari · The planet, right now</title>
</head>
<body>
  <canvas id="scene" data-t-aria="page.globe"></canvas>

  <div class="anchors" id="anchors"></div>

  <div class="probe" id="probe" aria-hidden="true">
    <span class="probe-ring"></span>
    <span class="probe-text"><b></b><small></small></span>
  </div>

  <header class="top">
    <div class="top-left">
      <button class="brand" id="brand" data-t-aria="page.home">Upari</button>
      <nav class="stories" id="stories" data-t-aria="page.stories"></nav>
    </div>
    <div class="top-actions">
      <form class="search" id="search" role="search" autocomplete="off">
        <input id="search-input" type="search" data-t-placeholder="page.search" data-t-aria="page.search" enterkeyhint="search" spellcheck="false" />
        <div class="search-panel">
          <p class="search-note" id="search-note" aria-live="polite"></p>
          <ol class="search-results" id="search-results"></ol>
          <p class="search-credit" data-t-html="page.searchCredit"></p>
        </div>
      </form>
      <button class="icon-btn" id="search-btn" data-t-aria="page.search" data-t-title="page.searchKey">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
      </button>
      <span class="clock" id="clock"></span>
      <button class="icon-btn" id="layers-btn" data-t-aria="page.explore" data-t-title="page.exploreKey">
        <svg viewBox="0 0 24 24"><path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
      </button>
      <button class="icon-btn sound-btn" id="sound-btn" aria-pressed="true" data-t-aria="page.audio" data-t-title="page.audioKey">
        <svg class="i-on" viewBox="0 0 24 24"><path d="M4 10v4h3.5L12 18V6L7.5 10z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
        <svg class="i-off" viewBox="0 0 24 24"><path d="M4 10v4h3.5L12 18V6L7.5 10z"/><path d="M16 10l4 4M20 10l-4 4"/></svg>
      </button>
      <button class="icon-btn" id="credits-btn" data-t-aria="page.credits" data-t-title="page.credits">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      </button>
      <button class="icon-btn" id="fs-btn" data-t-aria="page.fullscreen" data-t-title="page.fullscreenKey">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <section class="caption hidden" id="caption" aria-live="polite">
    <div class="kicker"><span class="num" id="cap-num"></span><span id="cap-kicker"></span></div>
    <h1 class="title" id="cap-title"></h1>
    <p class="line" id="cap-line"></p>
    <div class="cap-actions">
      <button class="more" id="more-btn"><span data-t="page.more"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <button class="more next-story" id="next-story"><span></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </section>

  <!-- Before and after: drag the line (src/story/explore.ts). -->
  <div class="swipe" id="swipe" aria-hidden="true">
    <i class="swipe-line"></i>
    <button class="swipe-handle" id="swipe-handle" data-t-aria="explore.compare"></button>
    <span class="swipe-label swipe-a" id="swipe-a"></span><span class="swipe-label swipe-b" id="swipe-b"></span>
  </div>

  <!-- A chart beside the planet, when a number needs its history (src/story/charts.ts). -->
  <figure class="chart" id="chart" aria-hidden="true">
    <svg id="chart-svg" role="img"></svg>
    <figcaption id="chart-cap"></figcaption>
  </figure>

  <!-- The time the planet is showing, centred over it: the date moves with the scene. -->
  <div class="data-clock" id="data-clock" aria-live="off">
    <span class="dc-now" id="data-time"></span>
    <span class="dc-row" aria-hidden="true"><span id="data-from"></span><span class="data-track"><i id="data-dot"></i></span><span id="data-to"></span></span>
  </div>

  <aside class="telemetry" id="telemetry" data-t-aria="station.panel">
    <div class="tm-title" data-t="station.title"></div>
    <dl>
      <dt data-t="station.alt"></dt><dd id="tm-alt"></dd>
      <dt data-t="station.speed"></dt><dd id="tm-speed"></dd>
      <dt data-t="station.below"></dt><dd id="tm-below"></dd>
      <dt data-t="station.light"></dt><dd id="tm-light"></dd>
      <dt data-t="station.pos"></dt><dd id="tm-pos"></dd>
      <dt data-t="station.orbit"></dt><dd id="tm-orbit"></dd>
    </dl>
  </aside>

  <aside class="legend" id="legend" aria-hidden="true">
    <div class="legend-title" id="legend-title"></div>
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-ends"><span id="legend-left"></span><span id="legend-right"></span></div>
  </aside>

  <nav class="rail" id="rail" data-t-aria="page.chapters">
    <button class="play" id="play-btn" data-t-aria="page.pause">
      <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
      <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>
    </button>
    <ol class="chapters" id="chapters"></ol>
    <div class="zoom">
      <button class="icon-btn" id="zoom-in" data-t-aria="page.zoomIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon-btn" id="zoom-out" data-t-aria="page.zoomOut"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    </div>
  </nav>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <button class="icon-btn drawer-close" id="drawer-close" data-t-aria="page.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="drawer-kicker" id="drawer-kicker"></div>
    <h2 id="drawer-title"></h2>
    <div class="facts" id="drawer-facts"></div>
    <p class="drawer-text" id="drawer-text"></p>
    <p class="drawer-source" id="drawer-source"></p>
  </aside>

  <aside class="explore" id="explore" aria-hidden="true" data-t-aria="explore.title">
    <button class="icon-btn drawer-close ex-close" id="explore-close" data-t-aria="page.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="ex-head" data-t="explore.title"></div>
    <div id="ex-layers"></div>
    <div class="ex-block ex-years" id="ex-years">
      <div class="ex-title"><span data-t="explore.year"></span> <b id="ex-year-label">2024</b></div>
      <div class="ex-row">
        <button class="ex-play" id="ex-play" data-t-aria="explore.playYears"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg></button>
        <input type="range" id="ex-year" min="1960" max="2025" step="1" value="2024" data-t-aria="explore.year" />
      </div>
    </div>
    <div class="ex-block ex-legend" id="ex-legend">
      <div class="ex-title" id="ex-legend-title"></div>
      <div class="legend-bar" id="ex-legend-bar"></div>
      <div class="legend-ends"><span id="ex-legend-left"></span><span id="ex-legend-right"></span></div>
    </div>
    <button class="more ex-compare" id="ex-compare"><span data-t="explore.compare"></span><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l-3 4 3 4M19 8l3 4-3 4"/></svg></button>
    <div class="ex-block ex-note" id="ex-note"><p id="ex-note-text"></p><p class="ex-note-source" id="ex-note-source"></p></div>
    <button class="more ex-iss" id="ex-iss"><span data-t="explore.reach"></span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <div class="ex-block">
      <div class="ex-title"><span data-t="explore.hour"></span> <b id="ex-hours-label"></b> <button class="ex-now" id="ex-now" data-t="explore.backToNow"></button></div>
      <input type="range" id="ex-hours" min="-24" max="24" step="0.25" value="0" data-t-aria="explore.hoursFromNow" />
    </div>
    <div class="ex-block ex-switches">
      <label><input type="checkbox" id="ex-real" /> <span data-t="explore.realLight"></span></label>
      <label><input type="checkbox" id="ex-clouds" /> <span data-t="explore.clouds"></span></label>
      <label><input type="checkbox" id="ex-spin" /> <span data-t="explore.spin"></span></label>
    </div>
  </aside>

  <div class="tile-credit" id="tile-credit" data-t-html="page.tileCredit"></div>

  <div class="hint" id="hint" data-t="page.hint"></div>

  <div class="veil" id="veil">
    <div class="intro" id="intro">
      <div class="intro-mark">Upari</div>
      <p class="intro-line" data-t="page.intro"></p>
      <div class="intro-actions">
        <button class="cta" id="start-btn"><span data-t="stories.pianeta"></span></button>
        <span class="break" aria-hidden="true"></span>
        <button class="cta cta-line" id="nature-btn"><span data-t="stories.natura"></span></button>
        <button class="cta cta-line" id="people-btn"><span data-t="stories.persone"></span></button>
        <button class="cta cta-line" id="sky-btn"><span data-t="stories.cielo"></span></button>
        <button class="ghost" id="explore-btn" data-t="page.exploreAlone"></button>
      </div>
      <button class="happening" id="happening"><i aria-hidden="true"></i><b></b><span></span></button>
      <div class="loader" id="loader"><span id="loader-bar"></span></div>
    </div>
  </div>

  <a class="embed-link" id="embed-link" href="https://upari.earth/" target="_blank" rel="noopener" data-t="page.embedOpen"></a>

  <div class="lang" id="lang">
    <button class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false" data-t-aria="page.language" data-t-title="page.language"><span id="lang-code"></span></button>
    <ul class="lang-list" id="lang-list" role="listbox" data-t-aria="page.language"></ul>
  </div>

  <button class="footer" id="footer" data-t-title="page.about"></button>

  <div class="credits" id="credits" aria-hidden="true">
    <div class="credits-inner">
      <button class="icon-btn drawer-close" id="credits-close" data-t-aria="page.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h2 data-t="credits.title"></h2>
      <p data-t="credits.intro"></p>
      <ul id="credits-list"></ul>
      <p class="credits-foot" data-t-html="credits.foot"></p>
    </div>
  </div>

  <div class="credits about" id="about" aria-hidden="true" role="dialog" aria-labelledby="about-title">
    <div class="credits-inner about-inner">
      <button class="icon-btn drawer-close" id="about-close" data-t-aria="page.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="about-kicker" data-t="about.kicker"></div>
      <h2 id="about-title" data-t="about.title"></h2>
      <p class="about-lead" data-t="about.lead"></p>
      <p data-t="about.aims"></p>
      <h3 data-t="about.costTitle"></h3>
      <p data-t="about.cost"></p>
      <p data-t="about.price"></p>
      <p class="about-oath"><b data-t="about.child"></b><b data-t="about.warrior"></b></p>
      <p data-t="about.both"></p>
      <h3 data-t="about.whoTitle"></h3>
      <p data-t="about.who"></p>
      <div class="about-actions">
        <a class="cta" href="https://netmilk.ch" target="_blank" rel="noopener" data-t="about.visit"></a>
        <a class="about-link" href="https://github.com/enuzzo/upari" target="_blank" rel="noopener"><span data-t="about.source"></span> →</a>
        <button class="about-link" id="classe-open"><span data-t="classe.open"></span> →</button>
      </div>
      <p class="about-signoff" data-t="about.signoff"></p>
    </div>
  </div>

  <div class="credits about classe" id="classe" aria-hidden="true" role="dialog" aria-labelledby="classe-title">
    <div class="credits-inner about-inner">
      <button class="icon-btn drawer-close" id="classe-close" data-t-aria="page.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="about-kicker" data-t="classe.kicker"></div>
      <h2 id="classe-title" data-t="classe.title"></h2>
      <p class="about-lead" data-t="classe.lead"></p>
      <h3 data-t="classe.showTitle"></h3>
      <ul class="classe-list"><li data-t-html="classe.show1"></li><li data-t-html="classe.show2"></li><li data-t-html="classe.show3"></li><li data-t-html="classe.show4"></li></ul>
      <h3 data-t="classe.askTitle"></h3>
      <ol class="classe-list"><li data-t="classe.ask1"></li><li data-t="classe.ask2"></li><li data-t="classe.ask3"></li><li data-t="classe.ask4"></li><li data-t="classe.ask5"></li><li data-t="classe.ask6"></li></ol>
      <h3 data-t="classe.readTitle"></h3>
      <ul class="classe-list"><li data-t="classe.read1"></li><li data-t="classe.read2"></li><li data-t="classe.read3"></li></ul>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
